<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit Values</title>
  </head>
  <body>
    <form action="/submit" method="post">
      <label for="first-value">First value</label>
      <input id="first-value" name="firstValue" type="text" required>

      <label for="second-value">Second value</label>
      <input id="second-value" name="secondValue" type="text" required>

      <button type="submit">Submit</button>
    </form>

  </body>
</html>
